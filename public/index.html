<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encurtador de URL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Cabeçalho direto e sem enrolação -->
    <header class="app-header">
      <h1>Encurtador de URL</h1>
    </header>

    <!-- Área principal de encurtamento direta (sem card) -->
    <section class="section-encurtar">
      <form id="form-encurtar" class="form-row">
        <input 
          type="url" 
          id="input-url" 
          placeholder="Cole sua URL aqui (ex: https://site.com)" 
          required
        >
        <button type="submit" id="btn-encurtar" class="btn btn-primary">Encurtar</button>
      </form>

      <!-- Feedback simples quando a URL é encurtada -->
      <div id="resultado-encurtada" class="box-sucesso hidden">
        <div class="resultado-linha">
          <a id="link-curto" href="#" target="_blank" rel="noopener noreferrer"></a>
          <button type="button" id="btn-copiar" class="btn btn-secundario">Copiar</button>
        </div>
        <div class="resultado-detalhes">
          <span id="info-original"></span> • <span id="info-data"></span> • <span id="badge-id"></span>
        </div>
      </div>
    </section>

    <!-- Seção de Consultas -->
    <section class="section-bloco">
      <h2>Consultas</h2>
      
      <div class="tab-list">
        <button type="button" class="tab-item active" data-tab="tab-id">Por ID</button>
        <button type="button" class="tab-item" data-tab="tab-data">Por Data</button>
        <button type="button" class="tab-item" data-tab="tab-codigo">Por Código</button>
      </div>

      <!-- Consulta por ID -->
      <div id="tab-id" class="tab-pane active">
        <form id="form-busca-id" class="form-row">
          <input type="number" id="input-busca-id" placeholder="Digite o ID (ex: 1)" min="1" required>
          <button type="submit" class="btn btn-secundario">Buscar</button>
        </form>
        <div id="resultado-busca-id" class="box-resultado hidden"></div>
      </div>

      <!-- Consulta por Data -->
      <div id="tab-data" class="tab-pane">
        <form id="form-busca-data" class="form-row">
          <input type="date" id="input-busca-data" required>
          <button type="submit" class="btn btn-secundario">Buscar</button>
        </form>
        <div id="resultado-busca-data" class="box-resultado hidden"></div>
      </div>

      <!-- Consulta por Código -->
      <div id="tab-codigo" class="tab-pane">
        <form id="form-busca-codigo" class="form-row">
          <input type="text" id="input-busca-codigo" placeholder="Código ou link encurtado" required>
          <button type="submit" class="btn btn-secundario">Buscar</button>
        </form>
        <div id="resultado-busca-codigo" class="box-resultado hidden"></div>
      </div>
    </section>

    <!-- Seção da Lista de URLs -->
    <section class="section-bloco">
      <div class="secao-cabecalho">
        <h2>URLs cadastradas</h2>
        <button type="button" id="btn-atualizar-lista" class="btn-link">Atualizar</button>
      </div>

      <div class="tabela-container">
        <table class="tabela">
          <thead>
            <tr>
              <th>ID</th>
              <th>Encurtamento</th>
              <th>Original</th>
              <th>Data</th>
              <th>Cliques</th>
              <th>Link</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo">
            <tr>
              <td colspan="6" class="texto-vazio">Nenhuma URL cadastrada ainda.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Rodapé minimalista -->
    <footer class="app-footer">
      linkEncounter • Projeto Prático
    </footer>
  </div>

  <div id="toast" class="toast hidden">Copiado!</div>

  <script src="app.js"></script>
</body>
</html>
